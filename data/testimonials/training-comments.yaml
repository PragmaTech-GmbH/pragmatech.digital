- text: >
    As feedback, I really wanted to let you know that your courses are
    genuinely excellent. Very focused and hands-on, far more so than many
    of the other resources on the internet or YouTube that essentially stop
    at Hello World. I've been a Java and Spring developer for many years, and
    I learned a lot from you, especially about integration testing. Thank you
    so much for that! It really helps me in my daily work.
  person: "Oli"
  position: "Course Student"
  context: "TDD Course"

- text: >
    Honestly, it's the best course content on testing in general. Most
