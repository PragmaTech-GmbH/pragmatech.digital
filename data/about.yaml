# Copy of the About page (layout: themes/pragmatech-theme/layouts/_default/about.html).

hero:
  eyebrow: "About PragmaTech"
  headline: "Confidence in Every Commit"
  intro: "We help Java and Spring Boot teams improve their software development lifecycle, so that they can ship without fear."
  missionLabel: "Our mission"
  mission: "Enable Clients to Ship with Confidence in Every Commit"

# The visualization: the path of a commit, with the north star above it.
northStar:
  title: "From Commit to Production"
  intro: "Confidence is not a final gate before the release. Each step of your lifecycle adds to it or takes it away."
  label: "Our North Star"
  value: "Confidence in Every Commit"
  questionLabel: "Your team asks"
  focusLabel: "We improve"
  loop: "What you learn in production goes back into the next commit."
  stages:
    - name: "Code"
      icon: "fa-solid fa-code"
      question: "Can we trust a change, whether a person or an AI agent wrote it?"
      focus: "Shared testing conventions and agent skills for Spring Boot"
    - name: "Test"
      icon: "fa-solid fa-vial-circle-check"
      question: "Does a green test suite mean that the application works?"
      focus: "Unit tests, Spring Boot test slices and integration tests with Testcontainers"
    - name: "Build"
      icon: "fa-solid fa-gauge-high"
      question: "How long do we wait for feedback?"
      focus: "Spring context caching, parallel test runs and faster Maven or Gradle builds"
    - name: "Review"
      icon: "fa-solid fa-code-pull-request"
      question: "Do we know what we merge?"
      focus: "Tests that explain behavior and quality checks that the team trusts"
    - name: "Ship"
      icon: "fa-solid fa-rocket"
      question: "Can we deploy on any day of the week?"
      focus: "A reliable pipeline that makes a release a routine step"

help:
  title: "How We Help Your Team"
  intro: "Start where it hurts the most."
  items:
    - title: "Find the Bottleneck"
      stages: "Whole lifecycle"
      text: "We look at how your team builds, tests and ships software, and agree on what to improve first."
    - title: "Trust Your Tests"
      stages: "Code and Test"
      text: "We help your team write tests that they trust and can maintain."
    - title: "Shorten Feedback Loops"
      stages: "Build and Ship"
      text: "We tackle slow and unreliable builds, so that your developers get feedback sooner."
    - title: "Grow Team Skills"
      stages: "Whole team"
      text: "Your team learns practices that they can keep using after our work ends."

# The rest of this section comes from the "authority" block in data/homepage.yaml.
director:
  eyebrow: "Meet Our Managing Director"

story:
  title: "Why PragmaTech Exists"
  paragraphs:
    - "Our founder, Philip Riecks, saw the same pattern while consulting for different companies: development teams struggled with unreliable tests, slow feedback cycles and little confidence when they deployed to production."
    - "What started with blog posts and conference talks is now consulting, workshops, courses and tools that address these problems."

principles:
  title: "How We Work"
  items:
    - title: "Pragmatic Approach"
      icon: "fa-solid fa-search"
      text: "We prefer practical solutions to theoretical perfection. Our recommendations come from real project experience and proven patterns."
    - title: "Continuous Learning"
      icon: "fa-solid fa-graduation-cap"
      text: "Technology changes quickly. We keep up with good practices and share what we learn openly."
    - title: "Honest Partnership"
      icon: "fa-solid fa-handshake"
      text: "We build relationships on trust and transparency, and we recommend what is best for your needs."

clients:
