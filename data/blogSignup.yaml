# Content of the two signup boxes on every blog post. All text below is a placeholder.
#
# "enabled: false": the box shows only on the development server, as a preview.
# The form then sends nothing to Mailchimp. Set "enabled: true" when the content is final.

# Box below the article text (partials/blog/signup.html)
footer:
  enabled: false
  title: "Grab Your Free Copy of Lorem Ipsum Dolor Sit Amet"
  # Markdown, a blank line starts a new paragraph
  text: |
    Lorem ipsum dolor sit amet, **consectetur adipiscing**, **sed do eiusmod** and avoid **tempor incididunt** to labore et dolore magna aliqua.

    Get your **free lorem ipsum** right after you've confirmed your newsletter subscription.
  # Cover image, for example "/images/books/my-cover.png". Empty shows a placeholder.
  image: ""
  imageWebp: ""
  imageAlt: ""
  emailPlaceholder: "Your Email"
  button: "Get Your Free Lorem Ipsum"
  note: "You can unsubscribe at any time. Read the [privacy policy](/privacy/)."
  success: "Almost done. Check your inbox and confirm your subscription."
  already: "You're already subscribed with this email address."
  # Key in params.mailchimp (hugo.yaml) with the numeric Mailchimp tag id. Required when enabled.
  tagKey: ""
  # Event name in Matomo
  campaign: "blog-article-footer"
  # Optional page to open after the signup. Empty shows the "success" text in the box.
  thankYouUrl: ""

# Box in the sticky right bar (partials/blog/sidebar.html)
sidebar:
  enabled: false
  eyebrow: "Free resource"
  title: "Your lead magnet goes here"
  image: ""
  imageWebp: ""
  imageAlt: ""
  text: "Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore."
  button: "Call to action"
  # "#blog-signup" jumps to the form below the article. Any other page or URL works too.
  url: "#blog-signup"
