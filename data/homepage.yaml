painSection:
  headline: "Does this sound like your current engineering reality?"
  subheadline: "Six symptoms tech leads tell us about every single week."

painPoints:
  - category: "Productivity Killer"
    title: "Painfully Slow Test Suite"
    description: "Endless test runs pull developers out of their flow and cause expensive context switches."
    icon: "clock"
  - category: "False Security"
    title: "Gaps Nobody Dares to Look At"
    description: "Thin coverage, flaky and unreliable tests lead to retry loops. Nobody trusts a green build."
    icon: "shield"
  - category: "Review Bottleneck"
    title: "Slow Feedback Loops"
    description: "AI writes code in minutes, but verifying it takes days. Developers become exhausted code auditors."
    icon: "loop"
  - category: "Hidden Cost"
    title: "Wasting Money"
    description: "Idle developers, wasted CI minutes and slow releases burn budget every single day."
    icon: "coins"
  - category: "The AI Time Bomb"
    title: "Flying Blind with AI Code"
    description: "Without a fast and comprehensive safety net, AI-generated code is a ticking time bomb for production bugs."
    icon: "eye"
  - category: "Sinking Metrics"
    title: "Fear of the Next Deployment"
    description: "Teams hit the brakes, and your DORA metrics drop because nobody dares to ship."
    icon: "trend-down"

