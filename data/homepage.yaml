fastFeedback:
  eyebrow: "The Solution"
  headline: "Fast Feedback: The Engine in the AI World"
  subheadline: "When AI generates code by the bucket, the bottleneck moves from writing it to verifying it. Fast feedback loops - automated testing and CI - are the protective engine that keep speed honest."
  imageAlt: "Animation: code changes from AI agents flow through the feedback engine. Failing changes are caught within seconds, fixed, and sent back through, so only verified changes ship as real value."
  doraLabel: "Backed by the DORA research"
  doraIntro: "DORA's Core Model puts \"Fast feedback\" alongside fast flow and a climate for learning as a capability that predicts software delivery performance - which in turn predicts organizational performance and well-being."
  doraImageAlt: "The DORA Core Model: capabilities (climate for learning, fast flow, fast feedback) predict performance (software delivery and reliability), which predicts outcomes (organizational performance and well-being)."
  doraPoints:
    - "Throughput is no longer the constraint - human time, attention, and QA capacity is. The fixed limit has become people, not code."
    - "The hard problem now is designing environments, feedback loops, and control systems so agents can build and maintain complex, reliable software at scale."
    - "Unattended agents parallelize the work, but only fast feedback keeps scarce developer attention from becoming the next bottleneck."

benefitsSection:
  headline: "Imagine Deploying in the AI Era with Zero Fear"
  subheadline: "The exact opposite of every pain point above - what life looks like 30 days in."

benefits:
  - title: "Record-Breaking Productivity"
    description: "A blazingly fast test suite that makes your developers instantly more productive, eliminating the constant dread of fatal bugs."
  - title: "The Unshakeable Safety Net"
    description: "A comprehensive test suite lets you leverage the full potential of AI tools risk-free, knowing every flaw is caught immediately."
  - title: "Long-term Autonomy"
    description: "Proven knowledge and guardrails anchored deep within your team keep the suite fast and comprehensive - permanently."

methodology:
  headline: "Our Blueprint for a Blazing Fast & Comprehensive Test Suite"
  subheadline: "Three phases. No heavy jargon. A safety net we build with you and keep in shape."
  steps:
    - title: "Baseline Analysis"
      description: "A ruthless look at where you stand today: how fast is your feedback, how much of your system is really protected, and where do flaky tests, slow builds and blind spots hold your team back?"
    - title: "Measures"
      description: "We close the gaps together, hands-on in your code and pipeline: Spring Context Caching, parallelization, Testcontainers optimization, flaky-test removal and the missing tests where they protect you most - with AI agents guided by proven testing skills."
    - title: "Target State, Locked In for Good"
      description: "We agree on a measurable target for speed and coverage up front and prove you reached it. Then we make it last: guardrails in CI, a standard workflow, team enablement and optional check-ins, so the safety net never erodes."
  cta:
    headline: "Want this blueprint applied to your project?"
    button: "Start with the Baseline Analysis"
    note: "15-minute call. We open with the baseline - no commitment, no pitch."

offer:
  headline: "How working together looks."
  subheadline: "Three things you can count on from day one."
  pillars:
    - tag: "Skin in the game"
      title: "The Guarantee"
      description: "Once we have the baseline analysis, we agree on a measurable target together: a faster and more comprehensive test suite. If we don't meet it, you pay nothing."
    - tag: "A handful at a time"
      title: "The Exclusivity"
      description: "We deliberately keep the client list short and work with only a handful of teams in parallel. Expect blazing-fast feedback, direct access, and zero queues."
    - tag: "The Bonus"
      title: "The Autopilot Upgrade"
      description: "You get a custom MCP-Server (or Skill) to make testing knowledge instantly accessible, plus optional monthly check-ins to keep your test suite fast and comprehensive and your DORA metrics from slipping."

testimonialsSection:
  headline: "Real Teams. Real Numbers."
  subheadline: "Two recent customer stories - Challenge, Solution, Result."

faqSection:
  headline: "Questions before booking?"
  faqs:
    - question: "How do I prepare for the meeting?"
      answer: "A short overview of your project is enough: age, team size, and the biggest challenges you're facing today. We'll discuss the rest together on the call."
    - question: "Will this work for Kotlin too?"
      answer: "Yes - the approach works for all JVM languages, including Kotlin, Groovy, and Scala."
    - question: "What does the 30-day discovery cover and how does it work?"
      answer: "If we identify we can help, we start with a detailed baseline analysis of your current situation. Based on that, we agree on measurable targets for speed and coverage. If we don't reach them, you pay nothing."
    - question: "Which Spring Boot versions do you support?"
      answer: "Everything starting from Spring Boot 2.x onwards, including Spring Boot 3 and the latest Spring Boot 4 releases."
    - question: "Which Java versions do you support?"
      answer: "All of them - from Java 8 to the latest release."

# Sticky side card next to the story on wide screens
railCTA:
  badge: "15 minutes, zero fluff"
  title: "Is your safety net fast and comprehensive enough? Let's find out."
  text: "We review your setup and find the biggest gap in your test suite - too slow or too thin. You get one concrete fix to ship next week."
  button: "Check my safety net"
  note: "No pitch. Worst case, your safety net gets stronger anyway."

finalCTA:
  headline: "Let's Analyze Your Situation"
  subheadline: "No sales pitch. A 15-minute walkthrough of where your test suite and pipeline currently stand."
  steps:
    - title: "Pick a slot"
      description: "Click the button and grab a 15-minute slot in my calendar."
    - title: "Briefly diagnose"
      description: "We'll discuss how fast and how comprehensive your test suite is today and the challenges you're hitting."
    - title: "See the optimization"
      description: "I'll show you exactly how an optimization would look for your specific setup - completely independent of whether we end up working together."
  buttonText: "Let's Analyze Your Setup"
  reassurance: "15 minutes. Zero pitch. You leave with at least one concrete optimization you can ship next week."
