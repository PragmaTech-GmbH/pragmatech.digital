# Lead magnet "3-PDF bundle": copy of the landing and download page.
campaign: "agentic-readiness-bundle"
thankYouPath: "/lp/agentic-readiness-bundle/thank-you/"
mailerLiteActionUrl: "https://assets.mailerlite.com/jsonp/1613864/forms/187358602568140384/subscribe"
contactEmail: "info@pragmatech.digital"

badge: "Free bundle for engineering leaders"
# Technology badges: they tell Java and Spring teams that this bundle is for them.
techBadges:
  - label: "Java"
    icon: "fa-brands fa-java"
    color: "text-orange-600"
  - label: "Spring Framework"
    icon: "fa-solid fa-leaf"
    color: "text-emerald-600"
headline: "Know what to fix"
highlight: "before you scale AI agents."
subheadline: "Three PDFs for engineering leaders, tech leads and heads of engineering: how Java teams test with AI in 2026, where it hurts, and where to invest first."
bullets:
  - "What 614 developers said about Spring Boot testing and AI in 26 sessions"
  - "What 92 engineers say AI is doing to their pipelines and reviews"
  - "Five investments to make first, each with a step for the next 30 days"

# Where the content comes from. Shown below the signup on the landing page.
sources:
  title: "Where our data and insights come from"
  intro: "PragmaTech focuses on developer experience, with years of hands-on work with Java and Spring teams. This bundle builds on that work. Each survey PDF is based on its own group of respondents."
  missionLabel: "Our mission"
  mission: "Enable Clients to Ship with Confidence in Every Commit"
  items:
    - value: "Consulting"
      label: "Our company consulting work with software teams"
    - value: "Speaking"
      label: "Conference talks, user groups, workshops and webinars"
    - value: "9,000"
      label: "People in our course academy"
    - value: "10,000"
      label: "People who read our Spring Boot testing newsletter"

# The two teasers on blog posts. Each one has its own copy, so a reader does not see the same
# headline twice on one page. The site footer has a third headline (partials/footer.html).
blog:
  sidebar:
    title: "Is Your Spring Boot Codebase Ready for AI Agents?"
    text: "Five investments for Java teams to make before they scale AI agents, each with a step for the next 30 days."
    button: "See What Is Inside"
  signup:
    title: "How Do Java Teams Test with AI in 2026?"
    text: "See what 614 developers said about Spring Boot testing and AI, and what 92 engineers say AI is doing to their pipelines and reviews."

covers:
  - key: "cover-productivity-report"
    file: "documents/lead-bundle/PragmaTech-Spring-Boot-Developer-Productivity-Report-2026.pdf"
    title: "The AI Productivity Paradox"
    meta: "Industry report - 11 pages"
  - key: "cover-top-investments"
    file: "documents/lead-bundle/PragmaTech-Top-5-Investments-Before-Scaling-AI-Agents.pdf"
    title: "Top 5 Investments Before You Scale AI Agents"
    meta: "Leader guide - 3 pages"
  - key: "cover-testing-survey"
    file: "documents/lead-bundle/PragmaTech-Spring-Boot-Testing-AI-Survey-2026.pdf"
    title: "Spring Boot Testing & AI Survey 2026"
    meta: "Live poll results - 4 pages"

form:
