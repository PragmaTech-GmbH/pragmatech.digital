  headline: "Your email is confirmed - here are your three PDFs"
  intro: "Open or save each PDF below. We also send you the link to your PDFs by email."

download:
  badge: "Your bundle"
  headline: "Your three PDFs are ready"
  intro: "Thank you for your interest. Open or save each PDF below."
  button: "Download PDF"
  callTitle: "Find your first investment in 15 minutes"
