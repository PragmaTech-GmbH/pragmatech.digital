baseURL: "https://pragmatech.digital/"
title: "PragmaTech GmbH - Build & Ship Software w/ Confidence"

params:
  description: "Cut through testing complexity and slow builds for faster feedback and fearless shipping."
  matomoURL: "https://analytics.rieckpil.de/"
  matomoSiteID: "3"
  scheduleCallUrl: "https://www.cal.eu/pragmatech/pragmatech-discovery"
  lunchAndLearnUrl: "https://cal.eu/pragmatech/lunch-and-learn"
  newsletterUrl: "https://www.linkedin.com/newsletters/7161721575862386688/"
  linkedinUrl: "https://www.linkedin.com/company/pragmatech-gmbh/"
  githubUrl: "https://github.com/PragmaTech-GmbH"
  defaultShareImage: "/images/pragmatech-social-banner.png"
  socialTitle: "PragmaTech GmbH - Build & Ship Software w/ Confidence"
  bannerText: "Our new open-source project [Spring Test Profiler](/products/spring-test-profiler/) is available! Try it now to speed up your Spring Boot builds."
  emails:
    contact: "info@pragmatech.digital"
    info: "info@pragmatech.digital"
    privacy: "info@pragmatech.digital"
    dpo: "info@pragmatech.digital"
  mailchimp:
    # Action URL from the Mailchimp embed form builder
    # (Audience > Signup forms > Embedded forms)
    actionUrl: "https://rieckpil.us20.list-manage.com/subscribe/post?u=0e1ba18c31aabbb76027a3e54&id=d60be7e492&f_id=007c7be0f0"
    u: "0e1ba18c31aabbb76027a3e54" # account hash, the u= query param of actionUrl
    id: "d60be7e492" # audience id, the id= query param of actionUrl
    tagId: "1678391" # numeric id of the tag "course-agentic-testing-interest"

relativeURLs: true
publishDir: "public"
theme: "pragmatech-theme"



# Align trailing slashes in URLs
canonifyURLs: true

# Content types configuration
archetypeDir: "archetypes"
contentDir: "content"

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: 'css'
    - source: '(postcss|tailwind)\.config\.js'
      target: 'css'

module:
  mounts:
    - source: 'assets'
      target: 'assets'
    - source: 'data'
      target: 'data'
    - disableWatch: true
      source: 'hugo_stats.json'
      target: 'assets/notwatching/hugo_stats.json'
