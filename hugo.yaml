relativeURLs: true
publishDir: "public"
theme: "pragmatech-theme"



# Align trailing slashes in URLs
canonifyURLs: true

# Allow templates to read PPP_* env vars (CopeCart product IDs) at build time.
# Setting `security` replaces Hugo's defaults, so the exec allow-list is repeated here:
# Hugo's documented default plus `node` (Hugo >= 0.160 runs Tailwind through node).
# See https://gohugo.io/configuration/security/
security:
  exec:
    allow:
      - '^(dart-)?sass(-embedded)?$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^PPP_'

# robots.txt from layouts/robots.txt, with the sitemap reference
enableRobotsTXT: true

# llms.txt (https://llmstxt.org) is a text overview of the site for AI tools. Blog posts also get a
# Markdown copy through the "markdown" output format, see content/blog/_index.md.
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home: ["html", "rss", "llms"]

# A manual "lastmod" in the front matter wins over the Git date (Netlify sets
# HUGO_ENABLEGITINFO), so the "Updated" date of a blog post is under author control.
frontmatter:
  lastmod: ["lastmod", ":git", ":default"]

# Content types configuration
archetypeDir: "archetypes"
contentDir: "content"

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: 'css'
    - source: '(postcss|tailwind)\.config\.js'
      target: 'css'

module:
  mounts:
    - source: 'assets'
      target: 'assets'
    - source: 'data'
      target: 'data'
    - disableWatch: true
      source: 'hugo_stats.json'
      target: 'assets/notwatching/hugo_stats.json'
