name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Same Hugo version as netlify.toml (HUGO_VERSION).
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.1"
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: hugo --gc --minify

      - name: Unit tests (PPP edge function)
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests against hugo serve
        run: npm run test:e2e

      # The real edge function under netlify dev, with the fake coupons from .env.example.
      - name: E2E tests against netlify dev
        run: |
          cp .env.example .env
          npm run test:e2e:netlify

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
