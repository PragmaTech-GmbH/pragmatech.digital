{{/* Narrative opener between hero and pain boxes. Copy: params.story */}}
{{ with .Params.story }}
<section class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-20" data-story>
        {{ with .eyebrow }}
        <p class="text-xs font-bold uppercase tracking-widest text-brand-600 mb-6">{{ . }}</p>
        {{ end }}
        <div class="space-y-6 border-l-4 border-brand-100 pl-6">
            {{ range .paragraphs }}
            <p class="text-lg md:text-xl text-slate-700 leading-relaxed">{{ . }}</p>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
