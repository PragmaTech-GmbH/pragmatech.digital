{{/* Dual audience: experienced with agents vs. not started yet. Copy: params.audience */}}
{{ with .Params.audience }}
<section class="bg-slate-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-20">
        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-10 text-center">{{ .headline }}</h2>
        <div class="grid md:grid-cols-2 gap-6">
            {{ range .items }}
            <div class="bg-white border border-slate-200 rounded-xl p-6 md:p-8 shadow-sm" data-audience>
                <h3 class="text-lg font-bold text-slate-900 mb-3">{{ .title }}</h3>
                <p class="text-slate-600 leading-relaxed">{{ .text }}</p>
            </div>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
