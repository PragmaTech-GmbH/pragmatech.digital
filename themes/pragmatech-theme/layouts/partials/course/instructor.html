{{/* Instructor section. Copy: params.instructor */}}
{{ with .Params.instructor }}
<section class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-20">
        <div class="grid lg:grid-cols-5 gap-12 items-center">
            <div class="lg:col-span-2">
                <picture>
                    <source srcset="/generated/images/rieckpil-speaker.webp" type="image/webp">
                    <img src="{{ .image }}" alt="{{ .imageAlt }}" class="w-full h-auto rounded-2xl shadow-lg" loading="lazy" width="712" height="812">
                </picture>
                <p class="mt-3 text-sm text-slate-500 italic text-center">{{ .imageCaption }}</p>
            </div>

            <div class="lg:col-span-3">
                <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">{{ .headline }}</h2>
                <p class="text-brand-600 font-semibold mb-6">{{ .name }} - {{ .role }}</p>
                <p class="text-lg text-slate-600 mb-6 leading-relaxed">{{ .intro }}</p>

                <ul class="space-y-3 mb-8">
                    {{ range .bullets }}
                    <li class="flex items-start gap-3 text-slate-700">
                        <span class="flex-shrink-0 inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 mt-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                            </svg>
                        </span>
                        <span>{{ . }}</span>
                    </li>
                    {{ end }}
                </ul>

                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide mr-1">{{ .talksLabel }}</span>
                    {{ range .talks }}
                    <span class="inline-flex items-center px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-700">{{ . }}</span>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
