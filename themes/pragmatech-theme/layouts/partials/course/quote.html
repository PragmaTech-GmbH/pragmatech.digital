{{/* Single spotlight testimonial placed next to a claim.
     Usage: partial "course/quote.html" (dict "quote" $q "tone" "white"|"slate") */}}
{{ $quote := .quote }}
{{ $tone := .tone | default "white" }}
{{ with $quote }}
<section class="{{ if eq $tone "slate" }}bg-slate-50{{ else }}bg-white{{ end }} border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-14 text-center" data-spotlight>
        <svg class="w-8 h-8 text-brand-100 mx-auto mb-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.17 6A5.17 5.17 0 002 11.17V18h6v-6H5.5a1.67 1.67 0 011.67-1.67V6zm9 0A5.17 5.17 0 0011 11.17V18h6v-6h-2.5a1.67 1.67 0 011.67-1.67V6z"/>
        </svg>
        <blockquote class="text-xl md:text-2xl font-semibold text-slate-800 leading-snug mb-6">&ldquo;{{ .text }}&rdquo;</blockquote>
        <div class="inline-flex items-center gap-3">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-brand-50 border border-brand-100 text-brand-900 font-bold text-sm" aria-hidden="true">{{ .initials }}</span>
            <span class="text-left">
                <span class="block text-sm font-semibold text-slate-900">{{ .person }}</span>
                <span class="block text-xs text-slate-500">{{ .position }}</span>
            </span>
        </div>
    </div>
</section>
{{ end }}
