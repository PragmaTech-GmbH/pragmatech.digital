{{/* Avatar for a testimonial: photo from static/images/testimonials/<photo>.jpg
     (webp from static/generated/) when `photo` is set, initials otherwise. */}}
{{ with .photo }}
<picture class="flex-shrink-0">
    <source srcset="/generated/images/testimonials/{{ . }}.webp" type="image/webp">
    <img src="/images/testimonials/{{ . }}.jpg"
         alt="{{ $.person }}"
         class="w-10 h-10 rounded-full object-cover border border-brand-100"
         width="40" height="40" loading="lazy" data-testimonial-photo>
</picture>
{{ else }}
<span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-brand-50 border border-brand-100 text-brand-900 font-bold text-sm" aria-hidden="true">{{ .initials }}</span>
{{ end }}
