{{/* Positioning callout: what this course is not. Copy: params.callout */}}
{{ with .Params.callout }}
<section class="bg-slate-900 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 md:py-16" data-callout>
        <div class="grid lg:grid-cols-5 gap-8 lg:gap-12 items-center">
            <div class="lg:col-span-3">
                {{ with .eyebrow }}
                <p class="text-xs font-bold uppercase tracking-widest text-amber-400 mb-3">{{ . }}</p>
                {{ end }}
                <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">{{ .title }}</h2>
                <p class="text-lg text-slate-300 leading-relaxed">{{ .text }}</p>
            </div>
            <ul class="lg:col-span-2 space-y-3">
                {{ range .bullets }}
                <li class="flex items-start gap-3 text-slate-200">
                    <span class="flex-shrink-0 inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 mt-0.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                    <span>{{ . }}</span>
                </li>
                {{ end }}
            </ul>
        </div>
    </div>
</section>
{{ end }}
