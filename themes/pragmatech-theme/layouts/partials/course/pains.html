{{/* Pain boxes: what agent-written tests look like without a harness. Copy: params.pains */}}
{{ with .Params.pains }}
<section class="bg-slate-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-20">
        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4 text-center">{{ .headline }}</h2>
        <p class="text-slate-600 text-center mb-10 max-w-2xl mx-auto">{{ .intro }}</p>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {{ range .items }}
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm" data-pain-item>
                <span class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-red-50 text-red-600 mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </span>
                <h3 class="text-lg font-bold text-slate-900 mb-2">{{ .title }}</h3>
                <p class="text-slate-600 text-sm leading-relaxed">{{ .text }}</p>
            </div>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
