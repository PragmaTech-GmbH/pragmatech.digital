{{/* Final call to action. Copy: params.finalCta */}}
{{ with .Params.finalCta }}
<section class="bg-slate-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-20 text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">{{ .headline }}</h2>
        <p class="text-slate-600 mb-8 max-w-2xl mx-auto">{{ .text }}</p>
        <a href="{{ .primaryCta.href }}"
           class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white px-8 py-4 rounded-lg font-bold text-lg shadow-lg shadow-brand-500/20 hover:shadow-xl hover:shadow-brand-500/30 hover:-translate-y-0.5 transition-all"
           data-final-cta>
            {{ .primaryCta.label }}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
        </a>
        <p class="text-sm text-slate-500 mt-6">
            {{ .companyNote }}
            <a href="mailto:{{ $.Site.Params.emails.contact }}" class="text-brand-600 font-semibold underline decoration-brand-300 underline-offset-4 hover:text-brand-500 transition-colors">{{ $.Site.Params.emails.contact }}</a>
        </p>
    </div>
</section>
{{ end }}
