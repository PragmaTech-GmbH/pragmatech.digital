{{ define "main" }}
<section class="relative overflow-hidden bg-white border-b border-slate-200">
    <div class="absolute inset-0 bg-gradient-to-br from-white via-brand-50/40 to-white pointer-events-none"></div>

    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20 lg:py-24">
        <div class="grid lg:grid-cols-2 gap-10 lg:gap-16 items-center">

            <!-- Left: copy -->
            <div data-lp="copy">
                {{ with .Params.hero }}
                <span class="inline-flex items-center px-4 py-1.5 mb-6 rounded-full
                             bg-brand-50 border border-brand-100
                             text-[11px] font-bold tracking-[0.18em] uppercase text-brand-900 shadow-sm shadow-brand-500/10">
                    {{ .badge }}
                </span>

                <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-6 leading-[1.1]">
                    {{ .title }}
                    <span class="bg-gradient-to-r from-brand-600 to-emerald-600 text-transparent bg-clip-text">{{ .highlight }}</span>
                </h1>

                <p class="text-lg md:text-xl text-slate-600 mb-6 leading-relaxed">{{ .subtitle }}</p>

                <p data-lp="deadline" class="inline-flex text-sm font-semibold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-8">
                    {{ .deadline }}
                </p>
                {{ end }}

                <ul class="space-y-3">
                    {{ range .Params.bullets }}
                    <li class="flex items-start gap-3 text-slate-700">
                        <span class="flex-shrink-0 inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 mt-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                            </svg>
                        </span>
                        <span>{{ . }}</span>
                    </li>
                    {{ end }}
                </ul>
            </div>

            <!-- Right: signup card -->
            {{ partial "lp-signup-card.html" . }}
        </div>
    </div>
</section>
{{ end }}
